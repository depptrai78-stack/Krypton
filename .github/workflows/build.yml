name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q krypton-fixed.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        working-directory: proj
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: proj/build.log
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krypton-jar
          path: proj/build/libs/*.jar
